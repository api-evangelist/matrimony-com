name: Matrimony Com
description: >-
  Matrimony.com Ltd is India's largest wed-tech company and a pioneer in online
  matchmaking since 2000. Headquartered in Chennai, it operates BharatMatrimony,
  EliteMatrimony, CommunityMatrimony, Jodii, MeraLuv and 300+ community and
  regional matrimony portals, alongside wedding-services brands WeddingBazaar,
  Mandap.com, ManyJobs and WeddingGiftBox. Publicly listed on the NSE and BSE,
  the company serves roughly 7.5 million customers monthly and is backed by
  investors including Mayfield. It is a consumer-facing platform and publishes no
  public developer API, SDK, or developer portal surface at this time.
